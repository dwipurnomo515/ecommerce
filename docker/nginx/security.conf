##
# Replaces /etc/nginx/server-opts.d/security.conf from serversideup/php.
#
# The image's version adds X-Frame-Options, X-Content-Type-Options,
# Referrer-Policy and HSTS to EVERY response. Laravel's SecurityHeaders
# middleware already sends stricter versions (DENY + CSP frame-ancestors),
# so browsers received each header twice with conflicting values.
#
# Rule: pages get their headers from Laravel (one place, tested).
#       Static files served directly by nginx get theirs in performance.conf.
#
# The file-access rules below are kept unchanged from the image.
##

# Block hidden files and directories (.env, .git) except /.well-known/
# (RFC 8615: ACME challenges, security.txt, passkey association files).
location ~ /\.(?!well-known) {
    deny all;
}

# Block files that may expose sensitive information (backups, configs, logs).
location ~* (?:#.*#|\.(?:bak|conf|config|dist|inc|ini|log|sh|sql|sw[op])|~)$ {
    deny all;
}
