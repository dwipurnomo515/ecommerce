##
# Replaces /etc/nginx/server-opts.d/performance.conf from serversideup/php.
#
# Same caching as the image, plus security headers for files nginx serves
# itself (Vite assets, product photos in /storage). Those responses never
# reach Laravel, so the SecurityHeaders middleware cannot add anything.
#
# nginx gotcha: an add_header inside a location REPLACES every add_header
# inherited from the server block, so each location lists all it needs.
##

location = /favicon.ico {
    log_not_found off;
    access_log    off;
}

location = /robots.txt {
    log_not_found off;
    access_log    off;
    try_files $uri /index.php?$query_string;
}

# Assets and media. Vite file names contain a content hash, so they can be
# cached forever. Uploaded photos get a new random name on every upload.
location ~* \.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv|svgz?)$ {
    add_header Cache-Control          "public, max-age=31536000, immutable";
    # Never let the browser treat an uploaded image as a script or page.
    add_header X-Content-Type-Options "nosniff" always;
    # An SVG opened directly may not run scripts or load anything.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
    access_log off;
    log_not_found off;
    try_files $uri /index.php?$query_string;
}

location ~* \.(?:ttf|ttc|otf|eot|woff2?)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control          "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri /index.php?$query_string;
}

gzip            on;
gzip_vary       on;
gzip_proxied    any;
gzip_comp_level 6;
gzip_types      text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
