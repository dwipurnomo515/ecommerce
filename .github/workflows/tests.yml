name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancel an older run of the same branch/PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Mirrors compose.yaml: same Postgres major version, dedicated "testing" DB.
    services:
      pgsql:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Overrides .env.example for the runner (no Docker hostnames, no Redis).
    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: intl, gd, bcmath, exif, pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
